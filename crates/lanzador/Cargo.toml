[package]
name = "lanzador"
description = "Plan y ejecución de la apertura de cada agente (Claude, Codex, Gemini y Programator) en Windows y Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Analizador TOML de referencia para comprobar que las cadenas de `-c` de Codex se leen igual
# que el valor original. Ya estaba en Cargo.lock por otra dependencia del espacio de trabajo.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
